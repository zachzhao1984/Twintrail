name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The build reads the repository and uploads artifacts to a draft release,
# so it needs contents: write for that upload alone.
permissions:
  contents: write

jobs:
  build:
    name: Build the universal disk image
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # mygo.json has no toolchain field, so go.mod's directive is what
          # pins the Go the build runs on.
          go-version-file: go.mod

      # Skipped on workflow_dispatch, which has no tag to check.
      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(jq -r .version mygo.json)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mygo.json, which says version $version."
            echo "::error::To release $GITHUB_REF_NAME, commit a mygo.json with version ${GITHUB_REF_NAME#v} and tag that commit."
            exit 1
          fi

      # mygo downloads libghostty-vt from a GitHub release asset on a cold
      # cache, and that redirect can fail with a transient EOF. Retry the
      # build a few times, but stop at the third failure and surface the
      # last error, so a real build failure is never masked.
      #
      # MYGO_UPDATER_PRIVATE_KEY is the repository secret holding the
      # signing key, base64 as mygo-update.key holds it. Without it mygo
      # still builds the disk image and skips the update files, so a
      # repository that has not set the secret yet releases normally,
      # just without the update a shipped app would offer.
      - name: Build the disk image
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${MYGO_UPDATER_PRIVATE_KEY:-}" ]; then
            echo "::warning::MYGO_UPDATER_PRIVATE_KEY is not set: building without the signed update files."
          fi
          for attempt in 1 2 3; do
            echo "::group::Build attempt $attempt of 3"
            if go tool mygo build --platform darwin/universal --skip-notarize; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            echo "::warning::Build attempt $attempt of 3 failed"
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::mygo build failed after 3 attempts; see the log above for the last error"
              exit 1
            fi
          done

      # Without the signing key there are no update files, so there is
      # nothing for -upload to send and the step would fail on "nothing to
      # upload". Skip it rather than break a release that has no updates.
      - name: Upload the update files to the draft release
        if: env.MYGO_UPDATER_PRIVATE_KEY != ''
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: go tool mygo build --platform darwin/universal --skip-notarize --skip-dmg -upload

      - uses: actions/upload-artifact@v7
        with:
          name: Twintrail-universal
          # out in mygo.json is build, and mygo writes the platform to
          # <out>/<goos>-<goarch>, which for this target is
          # build/darwin-universal, holding one disk image named
          # "Twintrail <version>.dmg" with no arch suffix.
          path: build/*/*.dmg
          if-no-files-found: error